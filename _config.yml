# Site Settings
theme: jekyll-theme-minimal
title: Turkish — Confox
description: Cybersecurity researcher and solo developer. Building tools at the intersection of security and AI.
url: "https://confox.github.io"
baseurl: ""

# SEO and Social Meta Tags
author: Turkish
email: turkish@d4rkwolf.co.uk
social_links:
  github: https://github.com/confox
  twitter: https://twitter.com/TurkishDW
  website: https://d4rkwolf.co.uk

# Social Sharing
twitter_username: TurkishDW
github_username: confox
show_excerpts: true # Option to show excerpts in listings

# Appearance
paginate: 5 # Number of posts to show per page (if blogging)
highlighter: rouge # Syntax highlighting for code

# Optional Plugins
plugins:
  - jekyll-feed # RSS feed for blog updates
  - jekyll-sitemap # Generates a sitemap for better search engine indexing
  - jekyll-seo-tag # Adds meta tags for SEO
  - jekyll-paginate # Pagination support

# Markdown Options
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    inline_theme: base16.light
    line_numbers: true

# Build Settings
exclude:
  - "README.md"
  - "Gemfile"
  - "Gemfile.lock"
